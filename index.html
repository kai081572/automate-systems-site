<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kai Özcan – AutoMate Systems</title>
<meta name="description" content="Kai Özcan, AutoMate Systems – mehr Marge im operativen Geschäft, ohne mehr Personal.">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <section class="card">
    <div class="ring" aria-hidden="true"></div>
    <div class="container">
      <div class="inner">
        <div class="logoBlock">
          <span class="logoText">AUTOMATE</span>
          <span class="logoLine"></span>
        </div>

        <div class="profileBlock">
          <h1 class="name">Kai Özcan</h1>
          <img class="photo" src="/assets/kai-oezcan.jpg" alt="Kai Özcan">
          <p class="role">AutoMate Systems</p>
        </div>

        <div class="divider" aria-hidden="true"></div>

        <div class="claimBlock">
          <h2 class="claimTitle">Mehr Marge im operativen Geschäft, ohne mehr Personal.</h2>
        </div>

        <div class="ctaRow">
          <a class="btn" href="mailto:kai@automate-systems.de">E-Mail schreiben</a>
        </div>

        <div class="footerRow">
          <a class="footerLink" href="/impressum">Impressum</a>
          <span class="footerDot">·</span>
          <a class="footerLink" href="/datenschutz">Datenschutz</a>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
